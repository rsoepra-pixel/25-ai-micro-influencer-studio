# Cek skema produksi: objek dari migrasi mana yang BELUM ada di database.
#
# Baca-saja (satu SELECT dari supabase/checks/cek-skema.sql, yang dihasilkan
# scripts/gen-cek-skema.mjs dari berkas migrasi). Dibuat 18 Nov 2026 setelah
# 0060 dan 0056 ketahuan tidak pernah diterapkan — masing-masing baru terlihat
# saat pelanggan menekan tombol. Jalankan setelah menambah migrasi, atau kapan
# pun ragu.
#
# Dua bagian. (1) Database: tabel, kolom, fungsi, view, index, trigger,
# policy, jadwal cron, dan kunci service_config dari migrasi — hasil kosong =
# semuanya ada. Perubahan DATA (update baris katalog) tidak diperiksa.
# (2) Fungsi server: fungsi yang kodenya di main lebih baru dari waktu
# terakhir dipasang ditandai TERTINGGAL.

name: Cek skema & fungsi (baca-saja)

on:
  workflow_dispatch:

env:
  PROJECT_REF: kheibvzbvnmhdeokokrw

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat penuh: dipakai untuk membandingkan commit terakhir tiap
          # fungsi dengan waktu fungsi itu terakhir dipasang.
          fetch-depth: 0
      - name: Bandingkan migrasi dengan database
        env:
          SUPABASE_DB_TOKEN: ${{ secrets.SUPABASE_DB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/gen-cek-skema.mjs
          jq -Rs '{query: ., read_only: true}' supabase/checks/cek-skema.sql > /tmp/body.json
          http=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_DB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json)
          echo "HTTP $http"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            head -c 2000 /tmp/resp.json; echo
            echo "::error::Query ditolak (HTTP $http)." >&2; exit 1
          fi
          n=$(jq 'length' /tmp/resp.json)
          {
            echo "### Cek skema"
            echo
            if [ "$n" = "0" ]; then echo "Semua objek dari migrasi ada di database."
            else
              echo "**$n objek belum ada:**"; echo
              echo "| berkas | jenis | nama | kolom |"; echo "|---|---|---|---|"
              jq -r '.[] | "| \(.berkas) | \(.jenis) | \(.nama) | \(.kolom // "") |"' /tmp/resp.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "BELUM ADA: $n"
          jq -r '.[] | "BELUM: \(.berkas) \(.jenis) \(.nama) \(.kolom // "")"' /tmp/resp.json

      # Fungsi yang kodenya berubah SETELAH terakhir dipasang = tertinggal.
      # Run deploy bisa gagal diam-diam (16 Nov 2026: CLI minta --yes,
      # rate limit setup-cli) dan fungsi yang berubah tidak terpasang.
      # Memakai token deploy (izin Edge Functions), bukan token database.
      - name: Bandingkan fungsi terpasang dengan kode di main
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/fn.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "HTTP $http"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            head -c 1000 /tmp/fn.json; echo
            echo "::error::Daftar fungsi tidak bisa dibaca (HTTP $http)." >&2; exit 1
          fi
          tertinggal=0
          {
            echo; echo "### Fungsi server"; echo
            echo "| fungsi | terpasang | commit terakhir | status |"; echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            kode=$(git log -1 --format=%ct -- "$dir")
            pasang_ms=$(jq -r --arg s "$fn" '.[] | select(.slug==$s) | .updated_at // empty' /tmp/fn.json)
            if [ -z "$pasang_ms" ]; then status="TIDAK TERPASANG"; tertinggal=$((tertinggal+1)); pasang="-"
            else
              pasang=$(( pasang_ms / 1000 ))
              if [ "$pasang" -lt "$kode" ]; then status="TERTINGGAL"; tertinggal=$((tertinggal+1)); else status="ok"; fi
              pasang=$(date -u -d "@$pasang" +%Y-%m-%dT%H:%MZ)
            fi
            echo "FUNGSI: $fn $status (terpasang $pasang, kode $(date -u -d "@$kode" +%Y-%m-%dT%H:%MZ))"
            echo "| $fn | $pasang | $(date -u -d "@$kode" +%Y-%m-%dT%H:%MZ) | $status |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "FUNGSI TERTINGGAL: $tertinggal"
