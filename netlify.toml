# ---------- Kapan Netlify BOLEH tidak membangun ----------
#
# Netlify menagih per build yang DIBULATKAN KE ATAS ke menit terdekat. Build
# repo ini cuma ~5 detik plus install lima dependency — tetap ditagih satu
# menit penuh. Jadi yang menghabiskan jatah bukan lamanya build, melainkan
# BANYAKNYA.
#
# Dan sebagian besarnya tidak menghasilkan apa-apa: dari 40 commit terakhir di
# main, 12 hanya menyentuh supabase/ — edge function dan migration, yang tidak
# satu byte pun dilayani Netlify. Ke-12 build itu menghasilkan dist yang sama
# persis dengan build sebelumnya. Netlify sendiri yang mengatakannya di ringkasan
# deploy: "All files already uploaded by a previous deploy with the same commits".
#
# Perintah di bawah ini menjawab satu pertanyaan: adakah perubahan di luar
# supabase/ dan file .md? Konvensi exit code Netlify untuk `ignore` terbalik dari
# kebiasaan — 0 berarti LEWATI build, bukan nol berarti BANGUN. Itu persis
# konvensi `git diff --quiet`, jadi keduanya dipasangkan langsung tanpa
# pembungkus yang bisa salah tafsir.
#
# GAGALNYA KE ARAH YANG AMAN. Kalau CACHED_COMMIT_REF kosong (build pertama,
# cache dibersihkan, riwayat di-rewrite), git keluar dengan kode 128 — bukan 0,
# jadi Netlify tetap membangun. Diuji ketiganya: commit khusus supabase melewati
# build, commit frontend membangun, dan ref kosong membangun.
#
# HANYA `ignore` yang diisi di sini, bukan `command` atau `publish`. Kunci yang
# tidak disebut di netlify.toml tetap jatuh ke setelan UI Netlify, dan setelan
# itu tidak bisa dibaca dari sini — menuliskannya ulang berarti menebak, dan
# tebakan yang meleset membuat situs terbit kosong. Perubahan terkecil yang
# menyelesaikan masalahnya sudah cukup.
#
# netlify.toml sendiri TIDAK dikecualikan. Berkas ini berisi aturan redirect
# yang menentukan endpoint MCP, OAuth, dan link pendek — mengubahnya tanpa
# deploy berarti aturan barunya tidak pernah berlaku.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!supabase' ':!*.md'"

# Routing Netlify untuk endpoint MCP + OAuth.
#
# Kenapa lewat sini dan bukan langsung ke supabase.co: klien MCP (termasuk
# claude.ai) mencari dokumen discovery di ROOT domain — `/.well-known/...`.
# Di supabase.co semua path kita terkurung di bawah /functions/v1/ dan root-nya
# bukan milik kita, jadi discovery selalu gagal. Netlify (yang sudah meng-host
# app ini) punya root yang kita kontrol, jadi dijadikan origin publik dan
# permintaan diteruskan (proxy, status 200 — URL di address bar tidak berubah)
# ke edge function Supabase.
#
# Urutan aturan penting: yang cocok duluan yang dipakai.

# ---------- Discovery (RFC 9728 / RFC 8414) ----------
# Varian tanpa path dan varian path-aware sama-sama dilayani, karena klien
# berbeda menyusun URL-nya berbeda.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/.well-known/oauth-authorization-server"
  status = 200
  force = true

# Sebagian klien jatuh ke OpenID Connect Discovery sebagai cadangan.
[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/openid-configuration/*"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/.well-known/oauth-authorization-server"
  status = 200
  force = true

# ---------- OAuth ----------
# Halaman consent dilayani sebagai file statis di sini (supabase.co tidak
# merender HTML di browser). Harus di atas aturan /oauth/* di bawahnya.
[[redirects]]
  from = "/oauth/authorize"
  to = "/oauth-authorize.html"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/oauth/:splat"
  status = 200
  force = true

# ---------- Link pendek ----------
# Proxy (200), bukan redirect (301/302), supaya function-nya yang menjawab dan
# bisa mencatat kliknya. Kalau ini dibuat 301, Netlify sendiri yang mengalihkan
# dan function-nya tidak pernah dipanggil — link tetap jalan, tapi angka
# kliknya nol selamanya tanpa ada yang sadar.
[[redirects]]
  from = "/r/*"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/r/:splat"
  status = 200
  force = true

# ---------- Endpoint MCP ----------
[[redirects]]
  from = "/mcp"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/*"
  to = "https://kheibvzbvnmhdeokokrw.supabase.co/functions/v1/mcp/:splat"
  status = 200
  force = true
