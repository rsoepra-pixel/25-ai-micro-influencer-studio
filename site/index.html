<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Micro Influencer Studio</title>
    <style>
      :root{--bg:#f7f7f9;--card:#fff;--border:#e7e7ec;--text:#17171c;--muted:#71717a;--accent:#7c3aed}
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
      a{color:inherit;text-decoration:none}
      .card{background:var(--card);border:1px solid var(--border);border-radius:16px}
      .gradient-title{background:linear-gradient(90deg,#7c3aed,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
      .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:none;cursor:pointer}
      .btn:hover{opacity:.9}.btn:disabled{opacity:.5;cursor:not-allowed}
      .btn2{background:#f3f3f6;color:var(--text);border:1px solid var(--border)}
      .input{width:100%;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:14px;background:#fff;font-family:inherit}
      .input:focus{outline:2px solid #c4b5fd}
      .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
      .badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
      .row{display:flex;gap:12px;align-items:center}
      .grid{display:grid;gap:16px}
      .muted{color:var(--muted)}
      .small{font-size:12px}
      .tiny{font-size:11px}
      .bold{font-weight:700}
      .mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}
      .mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}
      .p4{padding:16px}.p6{padding:24px}
      table{border-collapse:collapse;width:100%}
      th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding-bottom:8px}
      td{padding:8px 8px 8px 0;border-top:1px solid var(--border);vertical-align:top}
      select.input{appearance:auto}
      .avatar{border-radius:999px;background:#ede9fe;color:#6d28d9;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
      .avatar img{width:100%;height:100%;object-fit:cover}
      .sidebar a.nav{display:flex;align-items:center;gap:10px;border-radius:10px;padding:9px 12px;font-weight:500;color:#3f3f46}
      .sidebar a.nav:hover,.sidebar a.nav.active{background:#f5f3ff;color:#6d28d9}
      .thumb{aspect-ratio:3/4;border-radius:10px;background:#f4f4f5;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px}
      .thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
      .msg-err{color:#dc2626;background:#fef2f2;border-radius:10px;padding:10px;font-size:13px}
      .msg-ok{color:#15803d;background:#f0fdf4;border-radius:10px;padding:10px;font-size:13px}
      code{background:#f4f4f5;border-radius:4px;padding:1px 5px;font-size:12px}
    </style>
